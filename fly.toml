# ==========================================
# CallGuardianAI — Fly.io Deployment Configuration
# ==========================================

app = "callguardianai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CALLGUARDIAN_DB_PATH = "/data/callguardian.db"
  GEMINI_MODEL = "gemini-2.5-flash-lite"
  AUTH_COOKIE_SECURE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[mounts]
  source = "callguardian_data"
  destination = "/data"
